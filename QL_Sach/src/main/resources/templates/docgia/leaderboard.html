<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng Độc Giả - Thư Viện</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .leaderboard-hero {
            background: var(--login-gradient);
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.3);
        }
        .leaderboard-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .top-three {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .top-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--box-shadow);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
            width: 220px;
            border: 1px solid var(--border-color);
        }
        .top-card:hover { transform: translateY(-10px); }
        .top-card.rank-1 { height: 320px; border-color: #f1c40f; z-index: 2; }
        .top-card.rank-2 { height: 280px; border-color: #bdc3c7; }
        .top-card.rank-3 { height: 260px; border-color: #cd7f32; }
        .crown {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            color: #f1c40f;
        }
        .top-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--light-color);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--gray-color);
        }
        .top-name { font-weight: 700; margin-bottom: 5px; color: var(--text-main); display: block; }
        .top-count { color: var(--primary-color); font-weight: 600; font-size: 1.2rem; }
        
        .list-rank {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--border-color);
        }
        .rank-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
        }
        .rank-number {
            width: 40px;
            font-weight: 700;
            color: var(--gray-color);
            font-size: 1.1rem;
        }
        .rank-badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
        }
        /* Rank Aura Effects */
        @keyframes rank-glow {
            0% { box-shadow: 0 0 5px var(--rank-color), 0 0 10px var(--rank-color); }
            50% { box-shadow: 0 0 20px var(--rank-color), 0 0 30px var(--rank-color); }
            100% { box-shadow: 0 0 5px var(--rank-color), 0 0 10px var(--rank-color); }
        }
        .rank-aura {
            animation: rank-glow 2s infinite ease-in-out;
        }
        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--light-color);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main fade-in">
        <div class="leaderboard-hero">
            <h1>Đại Hội Anh Hùng Thư Viện</h1>
            <p>Vinh danh những bậc đại tài chăm học, thăng tiến trên con đường học thuật (Tu Tiên)</p>
            
            <div th:if="${docGiaList.size() >= 1}" class="top-three">
                <!-- Rank 2 -->
                <div th:if="${docGiaList.size() >= 2}" class="top-card rank-2">
                    <div class="top-avatar"><i class="fas fa-user"></i></div>
                    <span class="top-name" th:text="${docGiaList[1].hoTen}">Nguyễn Văn B</span>
                    <div class="badge rank-aura" th:text="${docGiaList[1].getTenCapBac()}" th:style="'--rank-color: ' + ${docGiaList[1].getRankColor()} + '; background-color:' + ${docGiaList[1].getRankColor()} + '; color: ' + ${docGiaList[1].getRankTextColor()} + '; padding: 5px 15px; border-radius: 50px; font-weight: 700; border: 1px solid white;'"></div>
                    <div class="top-count" th:text="${docGiaList[1].getTongSachMuon()} + ' Quyển'"></div>
                </div>

                <!-- Rank 1 -->
                <div th:if="${docGiaList.size() >= 1}" class="top-card rank-1">
                    <i class="fas fa-crown crown"></i>
                    <div class="top-avatar"><i class="fas fa-user-tie"></i></div>
                    <span class="top-name" th:text="${docGiaList[0].hoTen}">Nguyễn Văn A</span>
                    <div class="badge rank-aura" th:text="${docGiaList[0].getTenCapBac()}" th:style="'--rank-color: ' + ${docGiaList[0].getRankColor()} + '; background-color:' + ${docGiaList[0].getRankColor()} + '; color: ' + ${docGiaList[0].getRankTextColor()} + '; padding: 7px 20px; border-radius: 50px; font-weight: 800; border: 2px solid white;'"></div>
                    <div class="top-count" th:text="${docGiaList[0].getTongSachMuon()} + ' Quyển'"></div>
                </div>

                <!-- Rank 3 -->
                <div th:if="${docGiaList.size() >= 3}" class="top-card rank-3">
                    <div class="top-avatar"><i class="fas fa-user"></i></div>
                    <span class="top-name" th:text="${docGiaList[2].hoTen}">Nguyễn Văn C</span>
                    <div class="badge rank-aura" th:text="${docGiaList[2].getTenCapBac()}" th:style="'--rank-color: ' + ${docGiaList[2].getRankColor()} + '; background-color:' + ${docGiaList[2].getRankColor()} + '; color: ' + ${docGiaList[2].getRankTextColor()} + '; padding: 5px 15px; border-radius: 50px; font-weight: 700; border: 1px solid white;'"></div>
                    <div class="top-count" th:text="${docGiaList[2].getTongSachMuon()} + ' Quyển'"></div>
                </div>
            </div>
        </div>

        <div class="list-rank">
            <h3 style="margin-bottom: 20px; padding-left: 10px;"><i class="fas fa-list-ol"></i> Thứ Hạng Toàn Bộ</h3>
            <div th:each="dg, state : ${docGiaList}" class="rank-item" th:if="${state.index >= 3}">
                <div class="rank-number" th:text="${state.index + 1}">4</div>
                <div style="flex: 1">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                        <div>
                            <strong th:text="${dg.hoTen}">Tên</strong>
                            <span class="rank-badge" th:text="${dg.getTenCapBac()}" th:style="'background-color:' + ${dg.getRankColor()} + '; color: ' + ${dg.getRankTextColor()} + '; margin-left: 10px;'"></span>
                        </div>
                        <div style="text-align: right">
                            <span style="color: var(--primary-color); font-weight: 700" th:text="${dg.getTongSachMuon()}">0</span> quyển
                        </div>
                    </div>
                    <!-- Thanh tiến trình Tu Vi -->
                    <div class="progress-container">
                        <div class="progress-bar" 
                             th:style="'width: ' + (${dg.getTongSachMuon()} * 100 / 1000) + '%; background: ' + ${dg.getRankColor()}">
                        </div>
                    </div>
                </div>
                <div style="margin-left: 15px;">
                    <a th:href="@{/docgia/view/{id}(id=${dg.id})}" class="btn btn-outline btn-sm"><i class="fas fa-eye"></i></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Quản Lý Thư Viện. Hệ thống xếp hạng Đạo Hữu.</p>
    </footer>
</div>
</body>
</html>

        <p>&copy; 2026 Quản Lý Thư Viện. Hệ thống xếp hạng Đạo Hữu.</p>
    </footer>
</div>
</body>
</html>
